# Construye la imagen del backend en Cloud Build. Desde la raíz del repo:
#   gcloud builds submit --config apps/api/cloudbuild.yaml .
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/b20/api
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/api/Dockerfile, -t, '${_IMAGE}', .]
images: ['${_IMAGE}']
